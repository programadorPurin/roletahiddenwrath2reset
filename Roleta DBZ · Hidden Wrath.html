body::before{content:"";position:fixed;inset:0;background:linear-gradient(#01100acc,#03210ff0);z-index:-1}
header{text-align:center;padding:18px 10px 4px}
h1{margin:0;font-size:clamp(26px,6vw,42px);letter-spacing:4px;color:var(--g);text-shadow:0 0 14px var(--g)}
h1 span{color:var(--am);text-shadow:0 0 14px var(--am)}
header p{margin:4px 0 0;color:var(--g2);letter-spacing:3px;font-size:12px}
main{display:grid;gap:16px;max-width:1120px;margin:0 auto;padding:12px}
@media(min-width:900px){main{grid-template-columns:1.25fr .75fr;align-items:start}}
.pn{background:var(--pn);border:1px solid var(--ln);border-radius:14px;padding:14px;box-shadow:0 0 24px #39ff7a1f inset,0 0 18px #000a}
h2{margin:0 0 8px;font-size:15px;letter-spacing:3px;color:var(--g)}
#tabs{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:10px}
.tb{font:inherit;font-size:11px;background:#04200f;color:var(--g2);border:1px solid var(--ln);border-radius:8px;padding:5px 8px;cursor:pointer}
.tb.on{background:var(--g);color:#012;box-shadow:0 0 12px var(--g)}
.tb small{background:#0007;color:var(--am);border-radius:6px;padding:0 4px;margin-left:3px}
#stage{--S:min(92vw,540px);--hub:calc(var(--S)*.2);position:relative;width:var(--S);height:var(--S);margin:0 auto;max-width:100%}
